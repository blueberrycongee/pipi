name: Release

on:
  workflow_dispatch: {} # validation run: builds, signs, notarizes, verifies — publishes nothing
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  macos:
    name: Build, sign, notarize, verify
    runs-on: macos-15
    timeout-minutes: 90
    env:
      PIPI_RELEASE_TEAM_ID: ${{ secrets.PIPI_RELEASE_TEAM_ID }}
      PIPI_RELEASE_SIGN_ID: ${{ secrets.PIPI_RELEASE_SIGN_ID }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install nsh
        env:
          NSH_VERSION: v0.5.0
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: nsh check .
      - name: Install release credentials
        env:
          PIPI_RELEASE_CERTIFICATE_P12: ${{ secrets.PIPI_RELEASE_CERTIFICATE_P12 }}
          PIPI_RELEASE_CERTIFICATE_PASSWORD: ${{ secrets.PIPI_RELEASE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          node scripts/install-notary-key.mjs
          node scripts/import-release-signing.mjs
      - name: Build, sign, notarize and verify
        run: node scripts/release-macos.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: pipi-mac-arm64
          path: |
            release/pipi-*-mac-arm64.dmg
            release/pipi-*-macos-aarch64.tar.gz
            release/verification.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove release credentials
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/pipi-release.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/pipi-release.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/pipi-notary.p8" "$RUNNER_TEMP/pipi-release.p12"

  windows:
    name: Build (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install nsh
        shell: pwsh
        env:
          NSH_VERSION: v0.5.0
        run: |
          irm https://nsh.dev/install.ps1 | iex
          "$env:LOCALAPPDATA\nsh\bin" >> $env:GITHUB_PATH
      - run: nsh check .
      - name: Package
        run: nsh package . --target windows
      - name: Stage artifacts
        shell: pwsh
        run: |
          $v = (Get-Content nsh.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory release | Out-Null
          Get-ChildItem .nsh/out -File -Filter 'pipi*' | ForEach-Object {
            # Archives already carrying the nsh package name keep it — the
            # update manifest parses <name>-<version>-<os>-<arch>.
            $dest = $_.Name -match '^pipi-\d' ? $_.Name : ($_.Name -replace '^pipi', "pipi-$v-windows-x64")
            Copy-Item $_.FullName (Join-Path release $dest)
          }
          Get-ChildItem release
      - uses: actions/upload-artifact@v4
        with:
          name: pipi-windows-x64
          path: release/
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Build (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install nsh
        env:
          NSH_VERSION: v0.5.0
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: nsh check .
      - name: Package
        run: nsh package . --target linux
      - name: Stage artifacts
        run: |
          v=$(node -p 'require("./nsh.json").version')
          mkdir release
          for f in .nsh/out/pipi*; do
            [ -f "$f" ] || continue
            b=$(basename "$f")
            # Archives already carrying the nsh package name keep it — the
            # update manifest parses <name>-<version>-<os>-<arch>.
            case "$b" in
              pipi-[0-9]*) mv "$f" "release/$b" ;;
              *) mv "$f" "release/$(printf '%s' "$b" | sed "s/^pipi/pipi-$v-linux-x64/")" ;;
            esac
          done
          ls -la release
      - uses: actions/upload-artifact@v4
        with:
          name: pipi-linux-x64
          path: release/
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    needs: [macos, windows, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: pipi-*
          path: dist
          merge-multiple: true
      - name: Install nsh
        env:
          NSH_VERSION: v0.5.0
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const v = require("./dist/verification.json");
            if ("v" + v.version !== process.env.RELEASE_TAG) throw Error("Artifact version does not match tag");
          '
          cat > release-notes.md <<'EOF'
          **macOS**: signed with an Apple Developer ID certificate and notarized by Apple; both the disk image and `pipi.app` inside it carry stapled notarization tickets and passed Gatekeeper assessment before upload.

          **Windows**: unpack `pipi-*-windows-x64.zip` and run `pipi.exe` (or run the setup installer if present). The build is unsigned, so SmartScreen may ask for confirmation on first launch.

          **Linux**: unpack `pipi-*-linux-x64.tar.gz` and run `pipi`. Needs GTK 4.14 or newer (Ubuntu 24.04 and later).
          EOF
          # The update manifest the app's updater reads (`updater.github` in
          # nsh.json): written next to the archives, published beside them.
          # Only the nsh-named update archives parse — the dmg, installers and
          # receipts are assets, not manifest entries.
          v="${RELEASE_TAG#v}"
          nsh update-manifest \
            "dist/pipi-$v-macos-aarch64.tar.gz" \
            "dist/pipi-$v-windows-x86_64.zip" \
            "dist/pipi-$v-linux-x86_64.tar.gz" \
            --notes release-notes.md -o dist
          gh release create "$RELEASE_TAG" --verify-tag --title "pipi $RELEASE_TAG" \
            --notes-file release-notes.md dist/*
